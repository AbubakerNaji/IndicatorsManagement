name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# O4 — a minimal CI pipeline: build the backend, run tests, and build the frontend.
# Doesn't run integration tests (T1 needs testcontainers) or deploy.

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IndicatorsManagement.slnx

      - name: Build
        run: dotnet build IndicatorsManagement.slnx --no-restore --configuration Release --nologo

      - name: Test
        run: dotnet test tests/IndicatorsManagement.Tests/ --no-build --configuration Release --nologo --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'

  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Publish Docker images to GHCR on pushes to main.
  # The server pulls these via deploy/deploy.sh; pfSense HAProxy fronts them.
  images:
    name: Build & push Docker images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/IndicatorsManagement.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/indicatorsmanagement-api:latest
            ghcr.io/${{ steps.owner.outputs.value }}/indicatorsmanagement-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/indicatorsmanagement-web:latest
            ghcr.io/${{ steps.owner.outputs.value }}/indicatorsmanagement-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Auto-deploy on the internal server (192.168.1.170) using a self-hosted runner.
  # The runner is installed on the server itself, so GitHub Actions doesn't need to
  # reach it over the internet — the runner polls GitHub. Skips silently if the
  # self-hosted runner is offline.
  deploy:
    name: Deploy to indicators server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: [self-hosted, indicators-server]
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and restart the stack
        working-directory: /home/abubaker/IndicatorsManagement
        run: |
          set -euo pipefail
          echo "▶ Pulling latest…"
          git fetch --all -q
          git reset --hard origin/main -q
          echo "▶ Rebuilding + restarting…"
          docker compose up -d --build
          echo "▶ Waiting for /health…"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "✓ API healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "✗ API did not become healthy in 120s"
          docker compose logs --tail=40 api
          exit 1

