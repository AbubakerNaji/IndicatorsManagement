# =============================================================================
# IndicatorsManagement — production compose
#
# Runs pre-built images from GHCR (built by .github/workflows/ci.yml).
# Data lives in ./data/* bind-mounts so it survives container replacement AND
# is easy to back up with plain rsync/tar (no `docker volume` archaeology).
#
#   cp .env.example .env      # then fill in real values
#   ./deploy/deploy.sh         # pulls latest images + brings the stack up
#
# TLS and hostnames are handled by pfSense HAProxy in front of this stack; the
# services only expose plain HTTP on the internal network.
# =============================================================================

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: indicators-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_SA_PASSWORD:?DB_SA_PASSWORD is required — see .env.example}
    volumes:
      - ./data/db:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C -No || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [indicators]

  api:
    image: ghcr.io/abubakernaji/indicatorsmanagement-api:latest
    container_name: indicators-api
    ports:
      # HAProxy on pfSense forwards to this port on 192.168.1.170.
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=IndicatorsManagement;User ID=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__HangfireConnection=Server=db;Database=IndicatorsManagement_Hangfire;User ID=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;
      - Jwt__SecretKey=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required — see .env.example}
      - Jwt__Issuer=${JWT_ISSUER:-IndicatorsManagement}
      - Jwt__Audience=${JWT_AUDIENCE:-IndicatorsManagement}
      - Cors__AllowedOrigins__0=${FRONTEND_ORIGIN:-http://192.168.1.170}
      # O1 — attachments land on the host's ./data/uploads folder.
      - UploadsRoot=/app/uploads
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromEmail=${SMTP_FROM_EMAIL:-noreply@indicators.local}
      - Smtp__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [indicators]

  frontend:
    image: ghcr.io/abubakernaji/indicatorsmanagement-web:latest
    container_name: indicators-web
    ports:
      # HAProxy forwards HTTPS 443 → this port. No TLS inside the container.
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
    networks: [indicators]

networks:
  indicators:
    driver: bridge
