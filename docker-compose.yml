# Full stack (db + api + frontend). All secrets come from `.env` — see .env.example.
# For local development prefer docker-compose.dev.yml (database only).
#
#   cp .env.example .env   # then edit
#   docker compose up --build

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_SA_PASSWORD:?DB_SA_PASSWORD is required — see .env.example}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C -No || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/IndicatorsManagement.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=IndicatorsManagement;User ID=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__HangfireConnection=Server=db;Database=IndicatorsManagement_Hangfire;User ID=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;
      - Jwt__SecretKey=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required — see .env.example}
      - Cors__AllowedOrigins__0=http://localhost
      - Cors__AllowedOrigins__1=http://localhost:3000
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromEmail=${SMTP_FROM_EMAIL:-noreply@indicators.local}
      - Smtp__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - UploadsRoot=/app/uploads
    volumes:
      - api_uploads:/app/uploads
      - api_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlserver_data:
  api_uploads:
  api_logs:
